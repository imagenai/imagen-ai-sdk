name: Release Node SDK

# Publishes sdks/node to npm. Two gates before anything is uploaded:
#   1. Only runs on a deliberate `node-v*` tag (or manual dispatch) — never on a
#      push/merge to a branch, so merging to master never publishes.
#   2. The `publish` job `needs: test`, so a failing test suite blocks the upload.
#
# Auth: npm automation token in secret NPM_TOKEN. Until that secret is configured
# the publish step fails closed (nothing is released). Upgrade path: switch to
# npm trusted publishing (OIDC) + --provenance and drop the stored token.
#
# No workflow_dispatch: a manual dispatch would publish the selected branch's
# package.json version while skipping the tag-vs-version gate below. Releases
# always start with a node-v* tag.

on:
  push:
    tags:
      - "node-v*"

permissions:
  contents: read

defaults:
  run:
    working-directory: sdks/node

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json

      # On a tag release, the tag must match package.json version, or we'd ship a
      # version that doesn't match what was tagged.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/node-v')
        run: |
          tag="${GITHUB_REF_NAME#node-v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag version: $tag | package version: $pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag ($tag) does not match package version ($pkg)"; exit 1; }

      - run: npm ci
      # prepublishOnly runs the build on both the dry-run and the real publish
      - run: npm publish --dry-run
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
