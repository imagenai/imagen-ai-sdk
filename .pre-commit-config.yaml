repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.1
    hooks:
      # Run the linter. Scoped to the Python SDK; Node lint/format hooks can be added alongside.
      - id: ruff-check
        args: [ --fix ]
        files: ^sdks/python/.*\.py$
      # Run the formatter.
      - id: ruff-format
        files: ^sdks/python/.*\.py$